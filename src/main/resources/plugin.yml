name: LiveStatus
version: '1.0.0'
main: com.example.livestatus.LiveStatusPlugin
api-version: '1.21'
description: Adds a LIVE indicator to an authorized player's nametag when streaming Minecraft on YouTube.
author: LiveStatus Team
softdepend:
  - PlaceholderAPI

commands:
  mcast:
    description: Core MCast command for YouTube linking, status, and administration
    usage: /mcast <link|unlink|status|info|reload|admin|set|authorize|remove|user|youtuber|help>
    aliases: [youtube, yt, livestatus, ytlive]
  link:
    description: Link or unlink your YouTube account
    permission: livestatus.link
    usage: /link <youtube> [unlink]

permissions:
  mcast.admin:
    description: Grants full administrative access to MCast and LiveStatus
    default: op
    children:
      livestatus.admin: true
      ytlive.admin: true
  mcast.link:
    description: Grants permission to link a YouTube account
    default: true
    children:
      livestatus.link: true
  ytlive.admin:
    description: Grants full administrative access to LiveStatus and Web Panel
    default: op
    children:
      ytlive.panel: true
      ytlive.premium.manage: true
      ytlive.settings: true
      livestatus.admin: true
  ytlive.panel:
    description: Allows generating temporary Web Control Panel links
    default: op
  ytlive.premium.manage:
    description: Allows managing premium users and redeeming codes
    default: op
  ytlive.settings:
    description: Allows configuring plugin settings via command or web panel
    default: op
  livestatus.admin:
    description: Grants access to all administrative commands
    default: op
  livestatus.link:
    description: Grants permission to link a YouTube account when explicitly authorized by an admin
    default: true
  livestatus.bypass:
    description: Administrative bypass permission
    default: false
  youtubelivetag.admin:
    description: Backwards compatibility alias for livestatus.admin
    children:
      livestatus.admin: true
  youtubelivetag.link:
    description: Backwards compatibility alias for livestatus.link
    children:
      livestatus.link: true
  youtubelivetag.chat:
    description: Allows an authorized streamer to configure their own live announcements
    default: true
  livestatus.chat:
    description: Alias for youtubelivetag.chat
    children:
      youtubelivetag.chat: true
  youtubelivetag.chat.admin:
    description: Allows administrators to configure other streamers and global settings
    default: op
  livestatus.chat.admin:
    description: Alias for youtubelivetag.chat.admin
    children:
      youtubelivetag.chat.admin: true
  youtubelivetag.chat.bypass:
    description: Optional permission allowing a player to avoid receiving automatic announcements
    default: false
  livestatus.chat.bypass:
    description: Alias for youtubelivetag.chat.bypass
    children:
      youtubelivetag.chat.bypass: true
