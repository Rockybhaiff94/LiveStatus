name: LiveStatus
version: '1.0.0'
main: com.example.livestatus.LiveStatusPlugin
api-version: '1.21'
description: Adds a LIVE indicator to an authorized player's nametag when streaming Minecraft on YouTube.
author: LiveStatus Team
softdepend:
  - PlaceholderAPI

commands:
  youtube:
    description: LiveStatus administrative commands
    permission: livestatus.admin
    usage: /youtube <allow-link|revoke-link|status|reload|help> [player]
    aliases: [yt, livestatus]
  link:
    description: Link or unlink your YouTube account
    permission: livestatus.link
    usage: /link <youtube> [unlink]

permissions:
  livestatus.admin:
    description: Grants access to all administrative commands
    default: op
  livestatus.link:
    description: Grants permission to link a YouTube account when explicitly authorized by an admin
    default: true
  livestatus.bypass:
    description: Administrative bypass permission
    default: false
  youtubelivetag.admin:
    description: Backwards compatibility alias for livestatus.admin
    children:
      livestatus.admin: true
  youtubelivetag.link:
    description: Backwards compatibility alias for livestatus.link
    children:
      livestatus.link: true
